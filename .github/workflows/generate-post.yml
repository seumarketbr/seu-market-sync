name: Gerar Post do Blog

on:
  schedule:
    - cron: '0 11 * * *'  # 08:00 BRT - manha (operacional)
    - cron: '0 17 * * *'  # 14:00 BRT - tarde (sindico)
    - cron: '0 23 * * *'  # 20:00 BRT - noite (tecnologia)
  workflow_dispatch:
    inputs:
      motivo:
        description: 'Motivo da geracao manual'
        required: false
        default: 'Teste manual'

jobs:
  gerar-post:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Gerar post com IA
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python .github/scripts/generate_post.py

      - name: Atualizar manifest
        run: python .github/scripts/generate_manifest.py

      - name: Atualizar sitemap
        run: python .github/scripts/update_sitemap.py

      - name: Commit e push
        run: |
          git config user.name "Seu Market Bot"
          git config user.email "blog-bot@seumarketbr.com.br"
          git add public/blog-posts/ public/sitemap.xml
          git diff --cached --quiet || git commit -m "blog: novo post automatico $(date +'%Y-%m-%d %H:%M UTC') + sitemap atualizado"
          git push

      - name: Resultado
        if: success()
        run: |
          echo "Post publicado com sucesso."
          echo "Sitemap atualizado em public/sitemap.xml"
          echo "Cloudflare detectara o push e fara deploy automatico."
