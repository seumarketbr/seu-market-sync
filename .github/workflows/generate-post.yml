name: Gerar Post do Blog

on:
  schedule:
    - cron: '0 11 * * *'  # 08:00 BRT — manhã (operacional)
    - cron: '0 17 * * *'  # 14:00 BRT — tarde (síndico)
    - cron: '0 23 * * *'  # 20:00 BRT — noite (tecnologia)
  workflow_dispatch:
    inputs:
      motivo:
        description: 'Motivo da geração manual'
        required: false
        default: 'Teste manual'

jobs:
  gerar-post:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Gerar post com IA
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python .github/scripts/generate_post.py

      - name: Atualizar manifest
        run: python .github/scripts/generate_manifest.py

      - name: Commit e push
        run: |
          git config user.name "Seu Market Bot"
          git config user.email "blog-bot@seumarket.com.br"
          git add public/blog-posts/
          git diff --cached --quiet || git commit -m "blog: novo post automático $(date +'%Y-%m-%d %H:%M UTC')"
          git push

      - name: Trigger Cloudflare deploy
        if: success()
        run: |
          echo "Post publicado com sucesso. Cloudflare detectará o push e fará deploy automático."
          echo "Manifest atualizado — sitemap será gerado dinamicamente no próximo acesso."
