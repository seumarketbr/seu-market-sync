name: Generate Post

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Topic for the new post'
        required: true
        type: string
      force:
        description: 'Force generation even if post exists'
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '0 11 * * *'   # 08:00 BRT
    - cron: '0 17 * * *'   # 14:00 BRT
    - cron: '0 23 * * *'   # 20:00 BRT

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Generate post
        run: python .github/scripts/generate_post.py
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TOPIC: ${{ github.event.inputs.topic }}
          FORCE: ${{ github.event.inputs.force }}

      - name: Generate RSS feed
        run: python .github/scripts/generate_rss.py

      - name: Commit and push changes
        run: |
          git config --local user.email "seumarketbr@gmail.com"
          git config --local user.name "seumarketbr"
          git add public/blog-posts/*.json public/rss.xml
          git diff --cached --quiet || git commit -m "Add new post and update RSS [skip ci]"
          git push

      - name: Disparar deploy no Cloudflare
        if: success()
        run: |
          echo "Disparando deploy no Cloudflare..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}")
          if [ "$HTTP_STATUS" = "200" ] || [ "$HTTP_STATUS" = "201" ]; then
            echo "✅ Deploy disparado! Status: $HTTP_STATUS"
          else
            echo "⚠️ Cloudflare retornou status: $HTTP_STATUS (verifique o secret CLOUDFLARE_DEPLOY_HOOK)"
          fi
